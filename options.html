<!doctype html>
<meta charset="utf-8">
<title>X LLM Assistant settings</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
  label { display: block; margin-top: 14px; font-weight: 600; }
  input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
  small { color: #666; font-weight: 400; }
  button { margin-top: 20px; padding: 8px 16px; }
  #status { margin-left: 12px; }
  pre { background: #f4f4f4; padding: 8px; white-space: pre-wrap; }
</style>
<h2>X LLM Assistant</h2>
<label>Base URL <small>(OpenAI-compatible, ending in /v1)</small>
  <input id="baseUrl" placeholder="http://100.x.x.x:11434/v1"></label>
<label>API key <small>(leave empty if your server doesn't need one)</small>
  <input id="apiKey" type="password"></label>
<label>Model <small>(exact name your server uses)</small>
  <input id="model" placeholder="qwen2.5:27b"></label>
<label>Default reply language <small>(what "Translate my reply" targets)</small>
  <input id="defaultLang"></label>
<label>Summary language
  <input id="summaryLang"></label>
<button id="save">Save</button><button id="test">Test connection</button><span id="status"></span>
<pre id="out" hidden></pre>
<script src="options.js"></script>
